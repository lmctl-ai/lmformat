name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Test the installed package
        run: |
          mkdir -p "$RUNNER_TEMP/lmformat-smoke"
          npm install --prefix "$RUNNER_TEMP/lmformat-smoke" ./release/*.tgz --ignore-scripts --no-audit --no-fund
          cd "$RUNNER_TEMP/lmformat-smoke"
          node -e "const assert = require('node:assert/strict'); const { formatTable, formatRelativeTime } = require('@lmctl-ai/lmformat'); assert.equal(formatTable([['a', 'b'], ['long', 'c']]), 'a     b\\nlong  c'); assert.equal(formatRelativeTime(60000, { now: 0 }), '1m');"
          node --input-type=module -e "import { formatTable, printTable, formatRelativeTime } from '@lmctl-ai/lmformat'; if (![formatTable, printTable, formatRelativeTime].every(fn => typeof fn === 'function')) process.exit(1);"
