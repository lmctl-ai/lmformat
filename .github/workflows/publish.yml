name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate without publishing'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Ensure npm supports trusted publishing
        run: npm install --global npm@11
      - name: Verify release tag matches package version
        if: github.event_name == 'push' || !inputs.dry_run
        run: |
          node -e "const expected = 'refs/tags/v' + require('./package.json').version; if (process.env.GITHUB_REF !== expected) throw new Error('Publish from ' + expected);"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: npm-package
          path: release/*.tgz
          if-no-files-found: error
      - name: Validate publishing without uploading
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish ./release/*.tgz --access public --dry-run
      - name: Publish to npm with provenance
        if: github.event_name == 'push' || !inputs.dry_run
        run: npm publish ./release/*.tgz --access public --provenance
